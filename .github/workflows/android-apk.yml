name: Build Android APK

# Builds a signed release APK you can share with friends.
#   • Run manually: Actions → "Build Android APK" → Run workflow
#   • Or push a tag like v1.0.1 → the APK is also attached to a GitHub Release
# Required repository secrets: see README → "Build the APK on GitHub".

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Build with a placeholder API URL (checks the build only; the APK will not connect)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write # only used to attach the APK to a release on tag builds

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
      EXPO_PUBLIC_ATTACHMENTS: ${{ vars.ATTACHMENTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder config for smoke test
        if: inputs.smoke_test
        run: |
          echo "EXPO_PUBLIC_API_URL=https://smoke-test.invalid" >> "$GITHUB_ENV"

      - name: Check required secrets
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable API_URL to your API's URL (see README)"; exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be debug-signed and friends cannot install updates over it."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app
        run: npx tsc --noEmit

      - name: 'Write google-services.json (optional: enables background push on Android)'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 not set — background push is off; the in-app Inbox and reminders still work."
          fi

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "crew-tasks-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crew-tasks-apk
          path: crew-tasks-*.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: crew-tasks-*.apk
